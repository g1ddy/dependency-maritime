name: CLI Contract Checks

on:
  workflow_call:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/cli/**'
      - 'src/schema/**'
      - 'tests/cli-pack-smoke.test.ts'
      - 'tests/action-ref-resolution.test.ts'
      - 'action.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.cli.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  cli-package-compatibility:
    name: CLI package compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build CLI
      run: npm run build:cli

    - name: Verify packed CLI consumer contract
      run: npm run test:cli-package

  composite-action-render:
    name: Composite Action graph render smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'
        cache: 'npm'
    - run: npm ci
    - run: npm run build:cli
    - name: Exercise local composite Action compact render path
      uses: ./
      with:
        cli-source: '.'
        source-roots: 'src'
        output-dir: '.maritime-action-smoke'
        depcruise-config: 'config/.dependency-cruiser.cjs'
        fail-on-unmeasured: 'true'
        upload-artifact: 'false'
        render-graph: 'true'
        graph-output: 'docs/action-smoke/dependency-graph-compact.svg'
        graph-profile: 'compact-architecture'
        external-packages: 'none'
        folder-grouping: 'nested'
        edge-labels: 'none'
    - name: Verify compact rendered presentation exists
      run: test -s docs/action-smoke/dependency-graph-compact.svg
