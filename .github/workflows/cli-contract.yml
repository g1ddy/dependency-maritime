name: CLI Contract Checks

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/cli/**'
      - 'src/schema/**'
      - 'tests/cli-pack-smoke.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.cli.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/cli/**'
      - 'src/schema/**'
      - 'tests/cli-pack-smoke.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.cli.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  cli-package-compatibility:
    name: CLI package compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build CLI
      run: npm run build:cli

    - name: Verify packed CLI consumer contract
      run: npm run test:cli-package
