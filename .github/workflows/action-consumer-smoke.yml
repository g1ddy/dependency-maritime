name: Published action consumer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Create external consumer fixture
        shell: bash
        run: |
          mkdir -p src lib
          cat > package.json <<'EOF'
          {"name":"maritime-action-consumer","private":true,"type":"module","devDependencies":{"eslint":"^9.0.0"}}
          EOF
          cat > eslint.config.js <<'EOF'
          export default [{ files: ['**/*.ts'] }];
          EOF
          printf 'import { helper } from "../lib/helper";\nexport const run = () => helper();\n' > src/app.ts
          printf 'export const helper = () => "ok";\n' > lib/helper.ts

      - name: Install consumer dependencies
        run: npm install

      - name: Analyze with published development fallback
        # This manually dispatched diagnostic intentionally exercises the stable
        # development fallback action. Graph rendering is release-tested by the
        # tag-triggered publish-cli-prerelease workflow once a graph-capable tag exists.
        uses: g1ddy/dependency-maritime@cli-v0.1.0-beta.1
        with:
          source-roots: 'src lib'
          output-dir: '.maritime'
          upload-artifact: 'false'

      - name: Verify canonical bundle
        shell: bash
        run: |
          test -f .maritime/dependency-graph.json
          test -f .maritime/complexity-metrics.json
          test -f .maritime/complexity-report.md
          test -f .maritime/manifest.json
