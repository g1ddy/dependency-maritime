name: Publish CLI prerelease

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      cli-version: ${{ steps.version.outputs.cli-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - name: Resolve CLI version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            cli-v*) CLI_VERSION="${GITHUB_REF_NAME#cli-v}" ;;
            *) echo "Unsupported CLI release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

          # npm validates SemVer and updates package.json + package-lock.json only
          # in the release workspace. Version bumps are not committed to source.
          npm version "$CLI_VERSION" --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').version")" = "$CLI_VERSION"
          echo "cli-version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @dependency-maritime/cli@$CLI_VERSION from $GITHUB_REF_NAME"
      - run: npm run build:cli
      - run: npm run test:cli-package
      - name: Publish immutable prerelease
        run: npm publish --tag prerelease --access public

  published-consumer-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact released action revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: .action-source

      - name: Create clean external consumer fixture
        shell: bash
        run: |
          mkdir -p src lib
          cat > package.json <<'EOF'
          {"name":"maritime-action-consumer","private":true,"type":"module","devDependencies":{"eslint":"^9.0.0"}}
          EOF
          cat > eslint.config.js <<'EOF'
          export default [{ files: ['**/*.ts'] }];
          EOF
          printf 'import { helper } from "../lib/helper";\nexport const run = () => helper();\n' > src/app.ts
          printf 'export const helper = () => "ok";\n' > lib/helper.ts

      - name: Install consumer dependencies
        run: npm install

      - name: Analyze with released action and released CLI
        uses: ./.action-source
        with:
          source-roots: 'src lib'
          output-dir: '.maritime'
          upload-artifact: 'false'
          render-graph: 'true'
          graph-output: 'docs/images/dependency-graph.svg'

      - name: Verify canonical bundle
        shell: bash
        run: |
          test -f .maritime/dependency-graph.json
          test -f .maritime/complexity-metrics.json
          test -f .maritime/complexity-report.md
          test -f .maritime/manifest.json
          test -f docs/images/dependency-graph.svg
