name: Update Maritime Evidence

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  generate-metrics:
    if: contains(github.event.pull_request.labels.*.name, 'refactor')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Maritime Shared Integration
        uses: ./
        with:
          cli-source: '.'
          source-roots: 'src'
          output-dir: '.maritime'
          depcruise-config: 'config/.dependency-cruiser.cjs'
          fail-on-unmeasured: 'true'
          upload-artifact: 'false'
          render-graph: 'true'
          graph-output: 'docs/images/dependency-graph.svg'

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(metrics): update dependency graph and complexity report [skip ci]"
          file_pattern: '.maritime/ docs/images/dependency-graph.svg'
