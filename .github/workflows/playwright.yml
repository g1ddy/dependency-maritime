name: Playwright Tests
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.*.json'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/playwright.yml'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, Mobile Chrome, Mobile Safari]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # The configured projects use Chromium (desktop/mobile) and WebKit
        # (Mobile Safari). Avoid downloading unused Firefox binaries on every run.
        run: npx playwright install --with-deps chromium webkit

      - name: Build App
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e -- --project="${{ matrix.project }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
