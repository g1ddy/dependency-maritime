name: Crawler Command Interface Analysis

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'config/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'config/**'

jobs:
  analyze-crawler:
    name: Crawler Multi-Source Analysis & Baseline Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Analyze Crawler via Shared Maritime Action
        uses: ./
        with:
          cli-source: '.'
          source-roots: 'src lib'
          depcruise-config: 'config/.dependency-cruiser.cjs'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'true'
          artifact-name: 'crawler-maritime-artifacts'

      - name: Crawler Baseline Commit Verification
        run: |
          echo "Verifying Crawler .maritime baseline output..."
          test -f .maritime/manifest.json
          test -f .maritime/dependency-graph.json
          test -f .maritime/complexity-metrics.json
          test -f .maritime/complexity-report.md
