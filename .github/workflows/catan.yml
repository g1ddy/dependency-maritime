name: Catan Hex Mastery Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-catan:
    name: Catan Analysis & Legacy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Build CLI
        run: npm run build:cli

      - name: Package CLI
        run: npm pack

      - name: Analyze Catan via Shared Maritime Action
        uses: ./
        with:
          cli-source: '.'
          source-roots: 'src'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'true'
          artifact-name: 'catan-maritime-artifacts'

      - name: Catan Legacy Adapter (DOT & Diagram Documentation)
        run: |
          npm run generate:dot
          npm run generate:graph
