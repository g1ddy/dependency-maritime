name: Update Documentation Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths:
      - 'src/**'
      - '!src/cli/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - '.maritime/dependency-graph.json'
      - '.maritime/complexity-metrics.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'config/playwright.screenshots.config.ts'
      - 'tests/e2e/generate-screenshots.spec.ts'
      - 'tests/e2e/screenshot-assets.ts'
      - '.github/workflows/update-docs.yml'

concurrency:
  group: documentation-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Build Project
        run: npm run build
        env:
          VITE_APP_VERSION: DOCS

      - name: Reset canonical screenshots
        run: npx tsx tests/e2e/screenshot-assets.ts --reset

      - name: Generate Screenshots
        # We use the dedicated config which handles the server (port 4174) and test discovery
        run: npm run test:screenshots
        env:
          CI: true
          VITE_APP_VERSION: DOCS

      - name: Verify canonical screenshot set
        run: npx tsx tests/e2e/screenshot-assets.ts --verify

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'docs/images/screenshot-*.png'
          if git diff --cached --quiet; then
            echo "Documentation screenshots are already current."
            exit 0
          fi
          git commit -m "docs(assets): update screenshots [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
