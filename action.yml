name: 'Maritime Analyze and Validate'
description: 'Runs maritime analyze and validate on source roots, generating self-contained .maritime artifacts and optionally uploading them.'
author: 'Dependency Maritime'
branding:
  icon: 'anchor'
  color: 'blue'

inputs:
  node-version:
    description: 'Node.js version baseline to set up if Node is not already configured.'
    required: false
    default: '20.19.0'
  cli-source:
    description: 'Optional CLI source override for development (for example, a packed tarball). The action otherwise installs the CLI version derived from a cli-v* action tag, with the committed compatibility version as a branch/commit fallback.'
    required: false
    default: ''
  source-roots:
    description: 'One or more source roots to analyze (space, newline, or comma separated).'
    required: false
    default: 'src'
  depcruise-config:
    description: 'Optional path to custom dependency-cruiser configuration file.'
    required: false
    default: ''
  output-dir:
    description: 'Directory where .maritime output artifacts will be written.'
    required: false
    default: '.maritime'
  fail-on-unmeasured:
    description: 'Enforce strict measurement coverage (fails analysis if any implementation file is unmeasured).'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Whether to upload the generated .maritime artifact directory as a workflow artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the workflow artifact if upload-artifact is true.'
    required: false
    default: 'maritime-artifacts'
  render-graph:
    description: 'Whether to render the canonical dependency graph after successful analysis and validation. Reproducible committed SVG output is supported on Ubuntu runners.'
    required: false
    default: 'false'
  graph-output:
    description: 'Path for the derived Graphviz SVG when render-graph is true.'
    required: false
    default: 'docs/images/dependency-graph.svg'
  external-packages:
    description: 'External package presentation: none, summary, or direct.'
    required: false
    default: ''
  folder-grouping:
    description: 'Local folder clustering: none, top-level, or nested.'
    required: false
    default: ''
  edge-labels:
    description: 'Dependency-type labels: none or types.'
    required: false
    default: ''
  layout-direction:
    description: 'Graph direction: lr or tb.'
    required: false
    default: ''
  rank-constraints:
    description: 'Edges that affect rank placement: all or intra-folder.'
    required: false
    default: ''
  layout-density:
    description: 'Node and rank separation: normal or compact.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install and Resolve Maritime CLI
      shell: bash
      env:
        INPUT_CLI_SOURCE: ${{ inputs.cli-source }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # Branch/commit refs cannot encode a package version, so retain the last
        # known compatible package as a development fallback. Versioned action
        # tags are authoritative: cli-vX.Y.Z[-pre] resolves to package X.Y.Z[-pre].
        FALLBACK_CLI="@dependency-maritime/cli@0.1.0-beta.4"

        if [ -n "${INPUT_CLI_SOURCE:-}" ]; then
          CLI_SRC="$INPUT_CLI_SOURCE"
        elif [ -n "${MARITIME_CLI_TEST_SOURCE:-}" ]; then
          CLI_SRC="$MARITIME_CLI_TEST_SOURCE"
        elif [[ "${ACTION_REF:-}" == cli-v* ]]; then
          CLI_VERSION="${ACTION_REF#cli-v}"
          if ! npm view "@dependency-maritime/cli@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "Action ref $ACTION_REF does not resolve to a published @dependency-maritime/cli version." >&2
            exit 1
          fi
          CLI_SRC="@dependency-maritime/cli@$CLI_VERSION"
        else
          CLI_SRC="$FALLBACK_CLI"
        fi

        echo "Resolving Maritime CLI from: $CLI_SRC"

        if [ "$CLI_SRC" = "." ] || [ -f "$CLI_SRC/dist/cli/main.js" ] || [ -f "$CLI_SRC/main.js" ]; then
          if [ -f "$CLI_SRC/dist/cli/main.js" ]; then
            MARITIME_BIN="node $CLI_SRC/dist/cli/main.js"
          elif [ -f "$CLI_SRC/main.js" ]; then
            MARITIME_BIN="node $CLI_SRC/main.js"
          else
            MARITIME_BIN="node dist/cli/main.js"
          fi
        else
          npm install "$CLI_SRC" --no-save
          if [ ! -x "./node_modules/.bin/maritime" ]; then
            echo "Maritime CLI installation did not produce ./node_modules/.bin/maritime" >&2
            exit 1
          fi
          MARITIME_BIN="./node_modules/.bin/maritime"
        fi

        echo "MARITIME_BIN=$MARITIME_BIN" >> "$GITHUB_ENV"

    - name: Run Maritime Analyze
      shell: bash
      env:
        INPUT_SOURCE_ROOTS: ${{ inputs.source-roots }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_DEPCRUISE_CONFIG: ${{ inputs.depcruise-config }}
        INPUT_FAIL_ON_UNMEASURED: ${{ inputs.fail-on-unmeasured }}
      run: |
        ARGS=()
        ROOTS=$(echo "$INPUT_SOURCE_ROOTS" | tr ',\n' '  ')
        for ROOT in $ROOTS; do
          if [ -n "$ROOT" ]; then
            ARGS+=("--source" "$ROOT")
          fi
        done

        ARGS+=("--output" "$INPUT_OUTPUT_DIR")

        if [ -n "${INPUT_DEPCRUISE_CONFIG:-}" ]; then
          ARGS+=("--depcruise-config" "$INPUT_DEPCRUISE_CONFIG")
        fi

        if [ "${INPUT_FAIL_ON_UNMEASURED:-false}" = "true" ]; then
          ARGS+=("--fail-on-unmeasured")
        fi

        echo "Executing: $MARITIME_BIN analyze ${ARGS[*]}"
        $MARITIME_BIN analyze "${ARGS[@]}"

    - name: Run Maritime Validate
      shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        echo "Executing: $MARITIME_BIN validate $INPUT_OUTPUT_DIR"
        $MARITIME_BIN validate "$INPUT_OUTPUT_DIR"

    - name: Install controlled Graphviz
      if: ${{ inputs.render-graph == 'true' || inputs.render-graph == true }}
      uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2
      with:
        # Maritime's deterministic committed-SVG contract is the Ubuntu runner path.
        # setup-graphviz v2 currently emits GitHub's deprecated Node 20 runtime warning;
        # this pin is retained until an audited successor is available.
        ubuntu-graphviz-version: '2.42.2-9ubuntu0.1'

    - name: Render Maritime Dependency Graph
      if: ${{ inputs.render-graph == 'true' || inputs.render-graph == true }}
      shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_GRAPH_OUTPUT: ${{ inputs.graph-output }}
        INPUT_EXTERNAL_PACKAGES: ${{ inputs.external-packages }}
        INPUT_FOLDER_GROUPING: ${{ inputs.folder-grouping }}
        INPUT_EDGE_LABELS: ${{ inputs.edge-labels }}
        INPUT_LAYOUT_DIRECTION: ${{ inputs.layout-direction }}
        INPUT_RANK_CONSTRAINTS: ${{ inputs.rank-constraints }}
        INPUT_LAYOUT_DENSITY: ${{ inputs.layout-density }}
      run: |
        GRAPH_ARGS=(--input "$INPUT_OUTPUT_DIR" --output "$INPUT_GRAPH_OUTPUT")
        if [ -n "$INPUT_EXTERNAL_PACKAGES" ]; then
          case "$INPUT_EXTERNAL_PACKAGES" in none|summary|direct) ;; *) echo "Invalid external-packages value '$INPUT_EXTERNAL_PACKAGES'. Expected: none, summary, or direct." >&2; exit 2;; esac
          GRAPH_ARGS+=(--external-packages "$INPUT_EXTERNAL_PACKAGES")
        fi
        if [ -n "$INPUT_FOLDER_GROUPING" ]; then
          case "$INPUT_FOLDER_GROUPING" in none|top-level|nested) ;; *) echo "Invalid folder-grouping value '$INPUT_FOLDER_GROUPING'. Expected: none, top-level, or nested." >&2; exit 2;; esac
          GRAPH_ARGS+=(--folder-grouping "$INPUT_FOLDER_GROUPING")
        fi
        if [ -n "$INPUT_EDGE_LABELS" ]; then
          case "$INPUT_EDGE_LABELS" in none|types) ;; *) echo "Invalid edge-labels value '$INPUT_EDGE_LABELS'. Expected: none or types." >&2; exit 2;; esac
          GRAPH_ARGS+=(--edge-labels "$INPUT_EDGE_LABELS")
        fi
        if [ -n "$INPUT_LAYOUT_DIRECTION" ]; then
          case "$INPUT_LAYOUT_DIRECTION" in lr|tb) ;; *) echo "Invalid layout-direction value '$INPUT_LAYOUT_DIRECTION'. Expected: lr or tb." >&2; exit 2;; esac
          GRAPH_ARGS+=(--layout-direction "$INPUT_LAYOUT_DIRECTION")
        fi
        if [ -n "$INPUT_RANK_CONSTRAINTS" ]; then
          case "$INPUT_RANK_CONSTRAINTS" in all|intra-folder) ;; *) echo "Invalid rank-constraints value '$INPUT_RANK_CONSTRAINTS'. Expected: all or intra-folder." >&2; exit 2;; esac
          GRAPH_ARGS+=(--rank-constraints "$INPUT_RANK_CONSTRAINTS")
        fi
        if [ -n "$INPUT_LAYOUT_DENSITY" ]; then
          case "$INPUT_LAYOUT_DENSITY" in normal|compact) ;; *) echo "Invalid layout-density value '$INPUT_LAYOUT_DENSITY'. Expected: normal or compact." >&2; exit 2;; esac
          GRAPH_ARGS+=(--layout-density "$INPUT_LAYOUT_DENSITY")
        fi
        echo "Executing: $MARITIME_BIN graph ${GRAPH_ARGS[*]}"
        $MARITIME_BIN graph "${GRAPH_ARGS[@]}"

    - name: Upload Maritime Artifact Directory
      if: ${{ inputs.upload-artifact == 'true' || inputs.upload-artifact == true }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output-dir }}
          ${{ inputs.render-graph == 'true' && inputs.graph-output || '' }}
